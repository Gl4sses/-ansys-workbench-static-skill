name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_repo.py
      - run: python -m unittest discover -s skills/ansys-workbench-static/scripts/tests -v
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/build_release.py --output dist/ansys-workbench-static-skill.zip
